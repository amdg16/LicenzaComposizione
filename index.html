function chips(){
 const a=[];
 if(S.cat)a.push(['cat',S.cat+' · '+CAT[S.cat].it]);
 if(S.type)a.push(['type',D.types[S.type].ko+' · '+D.types[S.type].it]);
 if(S.ev)a.push(['ev',D.evals[S.ev].ko+' · '+D.evals[S.ev].it]);
 if(!a.length)return '';
 return a.map(([k,t])=>`<button class="tg ${k} sel" data-clr="${k}">${t} ✕</button>`).join('')+(a.length>1?'<button class="tg p" data-clr="all">모두 해제</button>':'')}
function seg(id,opts,cur){return `<div class="seg" id="${id}">${opts.map(([v,n])=>`<button data-v="${v}" class="${cur==v?'on':''}">${n}</button>`).join('')}</div>`}
function renderCourses(){
 const root=$('#s0');
 if(!root.dataset.built){
  root.innerHTML=`<div class="bar"><input type="search" id="q" placeholder="과목 검색 (한국어·이탈리아어)" enterkeyhint="search"><div id="scope"></div><div id="yr"></div><div class="act" id="act"></div><div class="sumline" id="sl"></div></div><div id="list"></div>`;
  $('#q').oninput=e=>{S.q=e.target.value.trim().toLowerCase();renderCourses()};
  root.dataset.built=1}
 $('#scope').innerHTML=seg('sc',[['req','필수'],['opt','선택 권장'],['all','전체']],S.scope);
 $('#yr').innerHTML=seg('yy',[['all','전체 학년'],['1','1학년'],['2','2학년']],S.y);
 $('#scope').onclick=e=>{const b=e.target.closest('button');if(b){S.scope=b.dataset.v;renderCourses()}};
 $('#yr').onclick=e=>{const b=e.target.closest('button');if(b){S.y=b.dataset.v;renderCourses()}};
 $('#act').innerHTML=chips();
 const l=ALL.filter(match).sort((a,b)=>CATK.indexOf(a.cat)-CATK.indexOf(b.cat));
 const groups=[];
 [1,2].forEach(y=>groups.push([`${y}학년 필수`,l.filter(c=>c.src=='req'&&c.ys[0]==y),y]));
 ['현재 개설','개설 가능'].forEach(s=>groups.push([`선택 권장 · ${s}`,l.filter(c=>c.src=='opt'&&c.st==s),0]));
 let out='';
 groups.forEach(([n,g,y])=>{if(!g.length)return;
  const lec=sum(g,'lec');
  out+=`<h2>${n}<span>${g.length}과목 · ${sum(g,'ects')} ECTS${y&&lec?` · 주당 강의 ${f1(wk(lec))}h`:''}</span></h2>`+g.map(card).join('')});
 $('#list').innerHTML=out||'<div class="empty">조건에 맞는 과목이 없어요</div>';
 $('#sl').textContent=`${l.length}과목 · ${sum(l,'ects')} ECTS · 카드의 태그를 누르면 필터돼요`}

// ---------- 태그 탭 ----------
function tagRows(items,kind,keyOf){
 return items.map(it=>{
  const req=D.req.filter(c=>keyOf(c)===it.key),opt=D.opt.filter(c=>keyOf({...c,cat:'학생 선택'})===it.key);
  const lec=sum(req,'lec');
  return `<button class="trow" data-tag="${kind}" data-v="${it.key}"><div class="l"><b>${it.ko}</b><span>${it.it}</span></div><div class="r"><b>${req.length}과목${opt.length?` +${opt.length}`:''}</b>${sum(req,'ects')} ECTS${lec?` · 주 ${f1(wk(lec)/2)}h`:''}</div><span class="chev">›</span></button>`}).join('')}
function renderTags(){
 const cats=D.cats.map(c=>({key:c.k,ko:c.k,it:c.full}));
 const types=Object.entries(D.types).map(([k,v])=>({key:k,ko:v.ko+' ('+k+')',it:v.it}));
 const evs=Object.entries(D.evals).map(([k,v])=>({key:k,ko:v.ko+' ('+k+')',it:v.it}));
 $('#s1').innerHTML=`<p class="note" style="margin-top:14px">누르면 해당 태그의 과목만 모아서 보여 줘요. 숫자는 필수 과목 수 (+선택 권장 과목 수)와 ECTS 합계이고, "주 Xh"는 필수 과목 강의시수를 2년 평균 주당 시간으로 환산한 값이에요 (${S.weeks}주 기준).</p>
 <h3>활동 유형 <span style="font-weight:400;font-size:12.5px;color:var(--mut)">Tipologia delle attività formative</span></h3>${tagRows(cats,'cat',c=>c.cat)}
 <h3>수업 형태 <span style="font-weight:400;font-size:12.5px;color:var(--mut)">Tipologia di insegnamento</span></h3>${tagRows(types,'type',c=>c.t)}
 <h3>평가 방식 <span style="font-weight:400;font-size:12.5px;color:var(--mut)">Tipo di valutazione</span></h3>${tagRows(evs,'ev',c=>c.ev)}`}

// ---------- 요약 탭 ----------
function renderSum(){
 const y1=REQ(1),y2=REQ(2);
 const stepper=`<div class="step"><div><b>수업 주 수: ${S.weeks}주</b><br><span style="font-size:12.5px;color:var(--mut)">한 해 수업 주 수를 바꾸면 주당 시간이 다시 계산돼요</span></div><div class="btns"><button id="mn">−</button><button id="pl">+</button></div></div>`;
 const kpi=(y,l)=>`<div><small>${y}학년 주당 강의</small><b>${f1(wk(sum(l,'lec')))}h</b><br><em>연 ${sum(l,'lec')}h · ${sum(l,'ects')} ECTS</em></div>`;
 const rows=CATK.map(k=>{const a=y1.filter(c=>c.cat==k),b=y2.filter(c=>c.cat==k),t=sum(a,'ects')+sum(b,'ects'),o=D.orig[k];
  return `<tr><td>${k}</td><td>${sum(a,'ects')}</td><td>${sum(b,'ects')}</td><td>${t}</td><td class="${t==o?'ok':'bad'}">${o}${t==o?' ✓':' ?'}</td></tr>`}).join('');
 const wrows=CATK.map(k=>{const a=sum(y1.filter(c=>c.cat==k),'lec'),b=sum(y2.filter(c=>c.cat==k),'lec');
  return `<tr><td>${k}</td><td>${a?f1(wk(a)):'–'}</td><td>${b?f1(wk(b)):'–'}</td></tr>`}).join('');
 $('#s2').innerHTML=`${stepper}
 <div class="kpi">${kpi(1,y1)}${kpi(2,y2)}</div>
 <h3>주당 시간 환산</h3>
 <table><tr><th></th><th>1학년</th><th>2학년</th></tr>
 <tr><td>연 강의시수</td><td>${sum(y1,'lec')}h</td><td>${sum(y2,'lec')}h</td></tr>
 <tr><td><b>주당 강의</b></td><td><b>${f1(wk(sum(y1,'lec')))}h</b></td><td><b>${f1(wk(sum(y2,'lec')))}h</b></td></tr>
 <tr><td>연 학습시수</td><td>${sum(y1,'study')}h</td><td>${sum(y2,'study')}h</td></tr>
 <tr><td>연 총시수</td><td>${sum(y1,'tot')}h</td><td>${sum(y2,'tot')}h</td></tr></table>
 <p class="note">학생 선택 활동(1학년 75h, 2학년 150h)과 졸업 시험(250h)은 강의시수가 없어 주당 강의에서는 빠지고 연 총시수에만 들어가요.</p>
 <h3>구분별 주당 강의 시간 (h)</h3>
 <table><tr><th>구분</th><th>1학년</th><th>2학년</th></tr>${wrows}</table>
 <h3>ECTS 요약</h3>
 <table><tr><th>구분</th><th>1학년</th><th>2학년</th><th>합계</th><th>원문</th></tr>${rows}
 <tr><td><b>총계</b></td><td><b>${sum(y1,'ects')}</b></td><td><b>${sum(y2,'ects')}</b></td><td><b>${sum(y1,'ects')+sum(y2,'ects')}</b></td><td class="${sum(y1,'ects')==60&&sum(y2,'ects')==60?'ok':'bad'}">${sum(y1,'ects')==60&&sum(y2,'ects')==60?'60+60 ✓':'?'}</td></tr></table>
 <p class="note">원문 열은 원본 PDF(2026-07-30)에 적힌 구분별 합계예요.</p>`;
 $('#mn').onclick=()=>{S.weeks=Math.max(10,S.weeks-1);save();renderSum()};
 $('#pl').onclick=()=>{S.weeks=Math.min(40,S.weeks+1);save();renderSum()}}

// ---------- 안내 탭 ----------
function renderInfo(){
 $('#s3').innerHTML=`<h3>수업 형태 · Tipologia di insegnamento</h3>
 ${Object.entries(D.types).map(([k,v])=>`<div class="card"><b>${k}</b> — ${v.ko} · ${v.it}</div>`).join('')}
 <h3>평가 방식 · Tipo di valutazione</h3>
 ${Object.entries(D.evals).map(([k,v])=>`<div class="card"><b>${k}</b> — ${v.ko} · ${v.it}</div>`).join('')}
 <h3>활동 유형 · Tipologia delle attività formative</h3>
 ${D.cats.map(c=>`<div class="card"><b>${c.k}</b><div class="it">${c.full}</div></div>`).join('')}
 <h3>계산 방식과 참고</h3>
 <div class="card" style="font-size:14px">
 <p style="margin:0 0 8px"><b>주당 강의 시간</b> = 강의시수(Ore di lezione) ÷ 수업 주 수. 수업 주 수는 PIMS 공식 학사일정에서 확인하지 못해 <b>2학기 × 12주 = 24주</b>로 가정한 값이고, 요약 탭에서 바꿀 수 있어요. 한 해 강의시수 기준이라 학기 단위 과목이면 실제 주당 시간은 더 커요.</p>
 <p style="margin:0 0 8px">수업 형태 C·G·I·L과 평가 E·ID의 뜻은 PIMS 학사 안내서와 이탈리아 음악 교육 문서의 일반적 의미로 풀이한 것이고, 원본 표에는 범례가 없어요. G는 안내서에서 "그룹"으로 읽혀서 소그룹(Gruppo)으로 적었어요.</p>
 <p style="margin:0">학년 배치와 시수·ECTS는 원본 PDF(2026-07-30, 1학년/2학년 열)와 대조했어요. 선택 권장 과목의 학년도 PDF 열 위치로 확인했어요.</p></div>`}

// ---------- 이벤트 ----------
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(+g.dataset.go);return}
 const t=e.target.closest('button.tg[data-k]');
 if(t){const k=t.dataset.k,v=t.dataset.v;S[k]=S[k]===v?null:v;renderCourses();return}
 const c=e.target.closest('[data-clr]');
 if(c){if(c.dataset.clr=='all')S.cat=S.type=S.ev=null;else S[c.dataset.clr]=null;renderCourses();return}
 const r=e.target.closest('.trow');
 if(r){S.cat=S.type=S.ev=null;S[r.dataset.tag]=r.dataset.v;S.scope='all';S.y='all';S.q='';const q=$('#q');if(q)q.value='';go(0)}
});
function render(){[renderCourses,renderTags,renderSum,renderInfo][S.tab]()}
go(S.tab);
</script>
</body>
</html>
