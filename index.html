<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>작곡 석사 과목표</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--mut:#6b6860;--line:#e4e1da;--acc:#2f5d8a;--accbg:#e6eef6;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#ecebe7;--mut:#9a978f;--line:#33322f;--acc:#7fb0e0;--accbg:#22303f;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header{padding:20px 0 8px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px}
nav{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;z-index:2;border-bottom:1px solid var(--line)}
nav button,.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on,.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){nav button.on,.chips button.on{color:#0d1a26}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
input[type=search]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card .ko{font-weight:600}
.card .it{color:var(--mut);font-size:13px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12.5px}
.tag{background:var(--accbg);color:var(--acc);padding:2px 9px;border-radius:999px}
.tag.p{background:transparent;border:1px solid var(--line);color:var(--mut)}
.hours{margin-top:8px;font-size:13px;color:var(--mut)}
.note{margin-top:6px;font-size:12.5px;color:var(--mut)}
h2{font-size:15px;margin:20px 0 0;color:var(--mut);font-weight:600}
.sum{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.sum b{font-size:20px;display:block}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px;margin-top:12px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:0}
.ok{color:var(--ok);font-weight:600}.bad{color:#c0392b;font-weight:600}
.warn{font-size:12.5px;color:var(--mut);margin-top:12px}
section{display:none}section.on{display:block}
</style>
</head>
<body>
<header><h1 id="t"></h1><div class="sub">탭을 눌러 필수 과목·ECTS·선택 과목을 볼 수 있어요</div></header>
<nav id="nav"></nav>
<section id="s0"></section><section id="s1"></section><section id="s2"></section><section id="s3"></section>
<script>
const D={"title": "작곡 석사(Licenza) 2년 과정 — 2025/26학년도부터 (문서 날짜: 2026-07-30)", "req": [{"y": 1, "cat": "기초", "ko": "성음악사", "it": "Storia della musica sacra", "t": "C", "lec": 54, "study": 46, "tot": 100, "ects": 4, "ev": "E"}, {"y": 1, "cat": "기초", "ko": "전례·음악 편성 (석사)", "it": "Programmazione liturgico-musicale (licenza)", "t": "C", "lec": 18, "study": 32, "tot": 50, "ects": 2, "ev": "E"}, {"y": 1, "cat": "기초", "ko": "성악 앙상블 및 합창 레퍼토리 1", "it": "Musica d'insieme vocale e repertorio corale 1 (licenza)", "t": "L", "lec": 54, "study": 96, "tot": 150, "ects": 6, "ev": "ID"}, {"y": 2, "cat": "기초", "ko": "성악 앙상블 및 합창 레퍼토리 2", "it": "Musica d'insieme vocale e repertorio corale 2 (licenza)", "t": "L", "lec": 54, "study": 96, "tot": 150, "ects": 6, "ev": "ID"}, {"y": 1, "cat": "특성화", "ko": "작곡 1a (석사)", "it": "Composizione 1a (licenza)", "t": "I", "lec": 27, "study": 198, "tot": 225, "ects": 9, "ev": "E"}, {"y": 1, "cat": "특성화", "ko": "작곡 1b (석사)", "it": "Composizione 1b (licenza)", "t": "I", "lec": 18, "study": 132, "tot": 150, "ects": 6, "ev": "E"}, {"y": 1, "cat": "특성화", "ko": "편곡·관현악법 1", "it": "Strumentazione e orchestrazione 1", "t": "I", "lec": 27, "study": 273, "tot": 300, "ects": 12, "ev": "E"}, {"y": 1, "cat": "특성화", "ko": "스코어 축약·종합의 방법론과 실습", "it": "Metodologia e pratica della riduzione e sintesi della partitura", "t": "I", "lec": 18, "study": 57, "tot": 75, "ects": 3, "ev": "E"}, {"y": 2, "cat": "특성화", "ko": "작곡 2a (석사)", "it": "Composizione 2a (licenza)", "t": "I", "lec": 27, "study": 198, "tot": 225, "ects": 9, "ev": "E"}, {"y": 2, "cat": "특성화", "ko": "작곡 2b (석사)", "it": "Composizione 2b (licenza)", "t": "I", "lec": 27, "study": 198, "tot": 225, "ects": 9, "ev": "E"}, {"y": 2, "cat": "특성화", "ko": "편곡·관현악법 2", "it": "Strumentazione e orchestrazione 2", "t": "I", "lec": 27, "study": 273, "tot": 300, "ects": 12, "ev": "E"}, {"y": 1, "cat": "통합·연관", "ko": "영상 음악", "it": "Musica applicata alle immagini", "t": "C", "lec": 18, "study": 57, "tot": 75, "ects": 3, "ev": "E"}, {"y": 1, "cat": "통합·연관", "ko": "음악 분석 1, 작곡 전공 (석사)", "it": "Analisi musicale 1, indirizzo Composizione (licenza)", "t": "C", "lec": 27, "study": 73, "tot": 100, "ects": 4, "ev": "E"}, {"y": 1, "cat": "통합·연관", "ko": "음악 미학 1", "it": "Estetica della musica 1", "t": "C", "lec": 27, "study": 73, "tot": 100, "ects": 4, "ev": "E"}, {"y": 2, "cat": "통합·연관", "ko": "음악 분석 2, 작곡 전공 (석사)", "it": "Analisi musicale 2, indirizzo Composizione (licenza)", "t": "C", "lec": 27, "study": 73, "tot": 100, "ects": 4, "ev": "E"}, {"y": 2, "cat": "통합·연관", "ko": "음악 미학 2", "it": "Estetica della musica 2", "t": "C", "lec": 27, "study": 73, "tot": 100, "ects": 4, "ev": "E"}, {"y": 1, "cat": "기타", "ko": "폴리포니아 1 (석사)", "it": "Polifonia 1 (licenza)", "t": "L", "lec": 27, "study": 23, "tot": 50, "ects": 2, "ev": "ID"}, {"y": 1, "cat": "학생 선택", "ko": "학생 선택 활동 (1학년)", "it": "Attività formative a scelta dello studente", "t": "", "lec": null, "study": null, "tot": 75, "ects": 3, "ev": ""}, {"y": 2, "cat": "학생 선택", "ko": "학생 선택 활동 (2학년)", "it": "Attività formative a scelta dello studente", "t": "", "lec": null, "study": null, "tot": 150, "ects": 6, "ev": ""}, {"y": 1, "cat": "졸업·이탈리아어", "ko": "외국인을 위한 이탈리아어", "it": "Lingua italiana per stranieri", "t": "L", "lec": 36, "study": 14, "tot": 50, "ects": 2, "ev": "E"}, {"y": 2, "cat": "졸업·이탈리아어", "ko": "졸업 시험", "it": "Prova finale", "t": "", "lec": null, "study": null, "tot": 250, "ects": 10, "ev": "ID"}], "opt": [{"st": "현재 개설", "ko": "폴리포니아 2 (석사)", "it": "Polifonia 2 (licenza)", "t": "L", "lec": 27, "study": 23, "tot": 50, "ects": 2, "ev": "ID", "note": ""}, {"st": "현재 개설", "ko": "폴리포니아 1 – 프로젝트 (석사)", "it": "Polifonia 1 – progetti (licenza)", "t": "L", "lec": 27, "study": 23, "tot": 50, "ects": 2, "ev": "ID", "note": ""}, {"st": "현재 개설", "ko": "폴리포니아 1 또는 2 – 프로젝트 (석사)", "it": "Polifonia 1 o 2 - progetti (licenza)", "t": "L", "lec": 27, "study": 23, "tot": 50, "ects": 2, "ev": "ID", "note": ""}, {"st": "현재 개설", "ko": "음향학·음악 심리음향학", "it": "Acustica e psicoacustica musicale", "t": "C", "lec": 18, "study": 57, "tot": 75, "ects": 3, "ev": "E", "note": "1·2학년 모두 표기"}, {"st": "현재 개설", "ko": "오르간 실습 1", "it": "Pratica organistica 1", "t": "I", "lec": 27, "study": 123, "tot": 150, "ects": 6, "ev": "E", "note": ""}, {"st": "현재 개설", "ko": "음악 고문서학 1", "it": "Paleografia musicale 1", "t": "G", "lec": 27, "study": 123, "tot": 150, "ects": 6, "ev": "E", "note": ""}, {"st": "현재 개설", "ko": "음악극사 1", "it": "Storia del teatro musicale 1", "t": "C", "lec": 27, "study": 73, "tot": 100, "ects": 4, "ev": "E", "note": ""}, {"st": "현재 개설", "ko": "전례 속의 시편", "it": "Salmi nella liturgia", "t": "C", "lec": 18, "study": 32, "tot": 50, "ects": 2, "ev": "E", "note": "1·2학년 모두 표기"}, {"st": "현재 개설", "ko": "그리스도교 전례 텍스트: 찬가", "it": "Testi liturgici cristiani: Innodia", "t": "G", "lec": 27, "study": 123, "tot": 150, "ects": 6, "ev": "E", "note": ""}, {"st": "현재 개설", "ko": "그리스도교 전례 텍스트: 트로푸스와 세쿠엔치아", "it": "Testi liturgici cristiani: Tropi e Sequenze", "t": "G", "lec": 27, "study": 123, "tot": 150, "ects": 6, "ev": "E", "note": ""}, {"st": "현재 개설", "ko": "음악극 작법", "it": "Drammaturgia musicale", "t": "G", "lec": 27, "study": 123, "tot": 150, "ects": 6, "ev": "E", "note": ""}, {"st": "개설 가능", "ko": "현대음악 기보법", "it": "Semiografia della musica contemporanea", "t": "C", "lec": 27, "study": 73, "tot": 100, "ects": 4, "ev": "E", "note": ""}, {"st": "개설 가능", "ko": "음악과 가상 구현 1 또는 2", "it": "Musica e realizzazione virtuale 1 o 2", "t": "L", "lec": 54, "study": 46, "tot": 100, "ects": 4, "ev": "ID", "note": ""}, {"st": "개설 가능", "ko": "성음악을 위한 디지털 커뮤니케이션", "it": "Comunicazione digitale per la musica sacra", "t": "C", "lec": 18, "study": 57, "tot": 75, "ects": 3, "ev": "E", "note": "1·2학년 모두 표기"}, {"st": "개설 가능", "ko": "녹음·오디오 후반작업 기술", "it": "Tecnologie della ripresa e della post-produzione audio", "t": "C", "lec": 18, "study": 32, "tot": 50, "ects": 2, "ev": "E", "note": "1·2학년 모두 표기"}], "orig": {"기초": 18, "특성화": 60, "통합·연관": 19, "기타": 2, "학생 선택": 9, "졸업·이탈리아어": 12}, "abbr": [["C", "강의 (collettivo)"], ["G", "소그룹 (gruppo)"], ["I", "개인 레슨 (individuale)"], ["L", "실습·워크숍 (laboratorio)"], ["E", "시험 (esame)"], ["ID", "이수 판정 (idoneità, 합격/불합격)"], ["ECTS", "유럽 학점"], ["강의 비율", "총시수 대비 강의시수"]]};
const $=s=>document.querySelector(s);
const TY={C:'강의',G:'소그룹',I:'개인 레슨',L:'실습·워크숍'},EV={E:'시험',ID:'이수 판정'};
document.title='작곡 석사 과목표';$('#t').textContent=D.title;
const tabs=['필수 과목','ECTS 요약','선택 권장','약어'];
tabs.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);$('#nav').appendChild(b)});
function show(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',i==j));document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i==j));try{localStorage.setItem('tab',i)}catch(e){}scrollTo(0,0)}
function card(c){
 const tags=[];
 if(c.t)tags.push(`<span class="tag">${TY[c.t]||c.t}</span>`);
 tags.push(`<span class="tag">${c.ects} ECTS</span>`);
 if(c.ev)tags.push(`<span class="tag p">${EV[c.ev]||c.ev}</span>`);
 if(c.cat)tags.push(`<span class="tag p">${c.cat}</span>`);
 const h=c.lec!=null?`강의 ${c.lec}h + 학습 ${c.study}h = 총 ${c.tot}h (강의 ${Math.round(c.lec/c.tot*100)}%)`:`총 ${c.tot}h`;
 return `<div class="card"><div class="ko">${c.ko}</div><div class="it">${c.it}</div><div class="meta">${tags.join('')}</div><div class="hours">${h}</div>${c.note?`<div class="note">${c.note}</div>`:''}</div>`}
// req
let fy='all',q='';
function renderReq(){
 const list=D.req.filter(c=>(fy=='all'||c.y==fy)&&(c.ko+c.it).toLowerCase().includes(q));
 let out='';
 [1,2].forEach(y=>{const l=list.filter(c=>c.y==y);if(!l.length)return;
  out+=`<h2>${y}학년 · ${l.reduce((a,c)=>a+c.ects,0)} ECTS</h2>`+l.map(card).join('')});
 $('#list').innerHTML=out||'<p class="sub">결과 없음</p>'}
$('#s0').innerHTML=`<input type="search" id="q" placeholder="과목 검색 (한국어·이탈리아어)"><div class="chips" id="fy"></div><div id="list"></div>`;
[['all','전체'],[1,'1학년'],[2,'2학년']].forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;b.className=v==fy?'on':'';b.onclick=()=>{fy=v;document.querySelectorAll('#fy button').forEach(x=>x.classList.toggle('on',x===b));renderReq()};$('#fy').appendChild(b)});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();renderReq()};
renderReq();
// ects
const cats=Object.keys(D.orig);
const sm=(y,c)=>D.req.filter(r=>r.cat==c&&(y==0||r.y==y)).reduce((a,r)=>a+r.ects,0);
const y1=D.req.filter(r=>r.y==1).reduce((a,r)=>a+r.ects,0),y2=D.req.filter(r=>r.y==2).reduce((a,r)=>a+r.ects,0);
$('#s1').innerHTML=`<div class="sum"><div><span class="sub">1학년</span><b>${y1}</b></div><div><span class="sub">2학년</span><b>${y2}</b></div><div><span class="sub">합계</span><b>${y1+y2}</b></div></div>
<table><tr><th>구분</th><th>1학년</th><th>2학년</th><th>합계</th><th>원문</th></tr>${cats.map(c=>{const t=sm(0,c),o=D.orig[c];return `<tr><td>${c}</td><td>${sm(1,c)}</td><td>${sm(2,c)}</td><td>${t}</td><td class="${t==o?'ok':'bad'}">${o}${t==o?' ✓':' ?'}</td></tr>`}).join('')}</table>
<p class="warn">학년 배치는 학점 합계(60+60)에 맞춰 정리한 것이라, 원본 PDF 표와 대조해 확인하세요. 원문 열은 PDF에 적힌 구분별 합계입니다.</p>`;
// opt
$('#s2').innerHTML=`<p class="sub" style="margin-top:12px">학생 선택 활동(1학년 3 + 2학년 6 ECTS)에 쓸 수 있는 권장 과목입니다. 한 번만 적힌 과목의 학년은 원본 PDF에서 확인이 필요합니다.</p>`+
['현재 개설','개설 가능'].map(s=>`<h2>${s}</h2>`+D.opt.filter(c=>c.st==s).map(card).join('')).join('');
// abbr
$('#s3').innerHTML=`<div style="margin-top:12px">`+D.abbr.map(([a,b])=>`<div class="card"><b>${a}</b> — ${b}</div>`).join('')+`</div><p class="warn">원문에 범례가 없어 이탈리아 음악 교육 문서의 일반적 의미로 보충한 것입니다.</p>`;
let t=0;try{t=+localStorage.getItem('tab')||0}catch(e){}show(t);
</script>
</body>
</html>
